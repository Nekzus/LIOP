<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Uniform Pure Black Canvas (Vercel Style) -->
  <rect width="1080" height="1080" fill="#000000" />

  <defs>
    <!-- Technical Background Grid (Unified across all 4 slides) -->
    <pattern id="technical-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121212" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#technical-grid)" opacity="0.75" />

  <!-- ==================== TOP SYSTEM BAR (SHARED FIXED ELEMENT) ==================== -->
  <g transform="translate(60, 50)">
    <!-- Compact Open Source Pill -->
    <rect width="128" height="32" rx="16" fill="#0C0C0C" stroke="#222222" stroke-width="1.2" />
    
    <!-- Lucide: CodeXml (14x14) in Emerald -->
    <g transform="translate(14, 9)">
      <g stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="10 10 13 7 10 4" />
        <polyline points="4 4 1 7 4 10" />
        <line x1="8.5" x2="5.5" y1="1.5" y2="12.5" />
      </g>
    </g>
    
    <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EDEDED" letter-spacing="0.4">
      Open Source
    </text>

    <!-- Status Pill: Fase de Pruebas (Minimalist Badge) -->
    <g transform="translate(140, 0)">
      <rect width="118" height="32" rx="16" fill="#0C0C0C" stroke="#222222" stroke-width="1.2" />
      <text x="59" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.3">
        Fase de Pruebas
      </text>
    </g>

    <!-- Slide Indicator -->
    <text x="960" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#71717A" letter-spacing="0.5">
      Slide 03 / 04
    </text>
  </g>

  <!-- ==================== SECTION TITLE & SUBTITLE (SHARED FIXED ELEMENT) ==================== -->
  <g transform="translate(60, 115)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      La Solución: Logic-on-Origin (LIOP)
    </text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#71717A">
      Invertir el flujo: el cómputo viaja al origen. Los datos nunca abandonan el host ni la red OT.
    </text>
  </g>

  <!-- ==================== ARCHITECTURE CARD: LOGIC-ON-ORIGIN (Y=205 to Y=625, H=420) ==================== -->
  <g transform="translate(60, 205)">
    <rect width="960" height="420" rx="14" fill="#080808" stroke="#222222" stroke-width="1.2" />

    <!-- Node Left: Cliente Orquestador (x=36, y=36, w=224, h=240) -->
    <g transform="translate(36, 36)">
      <rect width="224" height="240" rx="10" fill="#0D0D0D" stroke="#222222" stroke-width="1.2" />
      <rect x="16" y="14" width="108" height="20" rx="4" fill="#161616" />
      <text x="70" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#818CF8">ORQUESTADOR</text>

      <!-- Lucide: Bot (32x32) -->
      <g transform="translate(96, 52)">
        <g stroke="#EDEDED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M16 10V5H10"/><rect width="20" height="16" x="6" y="10" rx="2"/>
          <path d="M3 18h3"/><path d="M26 18h3"/><path d="M19 17v2"/><path d="M13 17v2"/>
        </g>
      </g>
      <text x="112" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#EDEDED">Orquestador</text>
      <text x="112" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#71717A">Agente, analítica o edge</text>

      <!-- Internal Detail Box -->
      <rect x="14" y="154" width="196" height="68" rx="6" fill="#131313" stroke="#1F1F1F" stroke-width="0.8" />
      <text x="112" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" fill="#71717A">Inyecta código de análisis</text>
      <text x="112" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#818CF8">Módulo WASI compilado</text>
    </g>

    <!-- Central Dual Channel (from x=260 to 700) -->
    <!-- Flow 1: Top Flow (Client -> Host Enclave) Y=120 -->
    <line x1="260" y1="120" x2="306" y2="120" stroke="#3730A3" stroke-width="1.8" stroke-dasharray="4 4" />
    
    <!-- Floating Badge 1: Logic Injection -->
    <g transform="translate(306, 98)">
      <rect width="348" height="44" rx="22" fill="#0E1326" stroke="#312E81" stroke-width="1.2" />
      <!-- Lucide: Cpu (18x18 in Indigo) -->
      <g transform="translate(18, 13)">
        <g stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <rect width="12" height="12" x="3" y="3" rx="2"/>
          <path d="M11 1v2"/><path d="M11 15v2"/><path d="M1 11h2"/><path d="M1 7h2"/>
          <path d="M15 11h2"/><path d="M15 7h2"/><path d="M7 1v2"/><path d="M7 15v2"/>
        </g>
      </g>
      <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#818CF8">
        1. Inyección de lógica WASI (&lt; 5 KB) →
      </text>
    </g>

    <line x1="654" y1="120" x2="692" y2="120" stroke="#3730A3" stroke-width="1.8" stroke-dasharray="4 4" />
    <path d="M688 114 L696 120 L688 126" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Flow 2: Bottom Flow (Host Enclave -> Client) Y=192 -->
    <line x1="694" y1="192" x2="654" y2="192" stroke="#065F46" stroke-width="1.8" stroke-dasharray="4 4" />

    <!-- Floating Badge 2: Computed Result + ZK-Proof -->
    <g transform="translate(306, 170)">
      <rect width="348" height="44" rx="22" fill="#041A14" stroke="#065F46" stroke-width="1.2" />
      <!-- Lucide: ShieldCheck (18x18 in Emerald) -->
      <g transform="translate(18, 13)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M9 17s6-3 6-7.5V4l-6-2.2L3 4v5.5c0 4.5 6 7.5 6 7.5z"/>
          <path d="m7 9 1.8 1.8 3.5-3.5"/>
        </g>
      </g>
      <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#34D399">
        ← 2. Resultado calculado + Recibo criptográfico
      </text>
    </g>

    <line x1="306" y1="192" x2="268" y2="192" stroke="#065F46" stroke-width="1.8" stroke-dasharray="4 4" />
    <path d="M272 186 L264 192 L272 198" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <text x="480" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#71717A">
      <tspan fill="#A1A1AA" font-weight="600">Zero-Trust:</tspan> Solo transitan micro-módulos de cómputo
    </text>
    <text x="480" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#71717A">
      y el resultado final verificado
    </text>

    <!-- Node Right: Enclave Soberano / Gateway Industrial (x=700, y=36, w=224, h=240) -->
    <g transform="translate(700, 36)">
      <rect width="224" height="240" rx="10" fill="#0D0D0D" stroke="#222222" stroke-width="1.2" />
      <rect x="16" y="14" width="108" height="20" rx="4" fill="#161616" />
      <text x="70" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#34D399">ENCLAVE LOCAL</text>

      <!-- Lucide: ShieldCheck (32x32 in Emerald) -->
      <g transform="translate(96, 52)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M16 29s11-5.5 11-14V6L16 2 5 6v9c0 8.5 11 14 11 14z"/>
          <path d="m12 15 3 3 6-6"/>
        </g>
      </g>
      <text x="112" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#EDEDED">Host de Origen / OT</text>
      <text x="112" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#71717A">Enclave WASI local o edge</text>

      <!-- Internal Detail Box -->
      <rect x="14" y="154" width="196" height="68" rx="6" fill="#131313" stroke="#1F1F1F" stroke-width="0.8" />
      <text x="112" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" fill="#71717A">Cómputo in-situ sobre datos</text>
      <text x="112" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#34D399">0 bytes de PII o OT expuestos</text>
    </g>

    <!-- Bottom Summary Box inside Card -->
    <g transform="translate(36, 306)">
      <rect width="888" height="84" rx="8" fill="#0D0D0D" stroke="#222222" stroke-width="1" />
      <!-- Lucide: ShieldCheck (22x22 in emerald) -->
      <g transform="translate(20, 31)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M11 20.5s7-3.6 7-9V5l-7-2.7-7 2.7v6.5c0 5.4 7 9 7 9z"/>
          <path d="m8.5 11 2 2 4-4"/>
        </g>
      </g>
      <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
        Garantía de custodia y soberanía de datos:
      </text>
      <text x="56" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#D4D4D8">
        El micro-módulo se ejecuta dentro de un sandbox Wasmtime aislado en el servidor o gateway industrial.
      </text>
      <text x="56" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        La base de datos o red OT jamás expone registros a la WAN; solo emite la respuesta calculada y firmada.
      </text>
    </g>
  </g>

  <!-- ==================== 3 ARCHITECTURAL GUARANTEE TILES (SHARED ROW: Y=655, H=250) ==================== -->
  <g transform="translate(60, 655)">
    <!-- Tile 1: Custodia Absoluta (w=304, h=250) -->
    <g transform="translate(0, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#34D399">SOBERANÍA DE DATOS</text>

      <g transform="translate(20, 56)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M11 20.5s7-3.6 7-9V5l-7-2.7-7 2.7v6.5c0 5.4 7 9 7 9z"/>
          <path d="m8.5 11 2 2 4-4"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Custodia Absoluta
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#34D399">
        Banca, Salud &amp; IIoT
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Los datos residen en su host/OT.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Cumplimiento nativo de GDPR.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Aislamiento perimetral estricto.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Cero exposición WAN de PII.
      </text>
    </g>

    <!-- Tile 2: Sandbox WASI Estricto (w=304, h=250, x=328) -->
    <g transform="translate(328, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#818CF8">SEGURIDAD DE CÓMPUTO</text>

      <g transform="translate(20, 56)">
        <g stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <rect width="12" height="12" x="3" y="3" rx="2"/>
          <path d="M11 1v2"/><path d="M11 15v2"/><path d="M1 11h2"/><path d="M1 7h2"/>
          <path d="M15 11h2"/><path d="M15 7h2"/><path d="M7 1v2"/><path d="M7 15v2"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Sandbox WASI Estricto
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#818CF8">
        Wasmtime (Rust)
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Runtime Wasmtime aislado.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Límites forzados de CPU y RAM.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Sin acceso a red o disco local.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Termina al completar la tarea.
      </text>
    </g>

    <!-- Tile 3: Recibos Criptográficos (w=304, h=250, x=656) -->
    <g transform="translate(656, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#EDEDED">INTEGRIDAD Y EFICIENCIA</text>

      <g transform="translate(20, 56)">
        <g stroke="#EDEDED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Recibos Criptográficos
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#EDEDED">
        HMAC-SHA256 &amp; gRPC
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Salida sellada con HMAC-SHA256.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Prueba verificable de ejecución.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Transporte Tonic gRPC seguro.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Reducción de context tokens y WAN.
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER / SHARED FIXED ACTION BAR ==================== -->
  <g transform="translate(60, 960)">
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#71717A">
      LIOP: El cómputo viaja al dato, no el dato al cómputo
    </text>

    <!-- Swipe Prompt Pill (w=280, h=42, rx=21) -->
    <g transform="translate(680, 5)">
      <rect width="280" height="42" rx="21" fill="#121212" stroke="#2B2B2B" stroke-width="1.2" />
      <text x="26" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">
        Desliza hacia la implementación
      </text>
      <!-- Lucide: ArrowRight -->
      <g transform="translate(244, 13)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="2" y1="8" x2="14" y2="8"/>
          <polyline points="9 3 14 8 9 13"/>
        </g>
      </g>
    </g>
  </g>
</svg>
