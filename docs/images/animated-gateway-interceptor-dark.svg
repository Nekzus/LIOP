<svg width="900" height="350" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
    <!-- Base Background -->
    <rect width="900" height="350" fill="#09090b" rx="16" />
    
    <defs>
        <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
    </defs>

    <style>
        .title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #fafafa; }
        .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 400; fill: #a1a1aa; }
        .stage-badge { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
        .badge-amber { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #f59e0b; letter-spacing: 1px; }
        .badge-green { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 700; fill: #10b981; letter-spacing: 1px; }
        .badge-red { font-family: 'Inter', system-ui, sans-serif; font-size: 8px; font-weight: 700; fill: #ef4444; }
        .code-pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #38bdf8; }

        @keyframes streamFlow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .anim-track {
            stroke: #38bdf8;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 4 20;
            animation: streamFlow 0.8s linear infinite;
            filter: drop-shadow(0 0 5px rgba(56,189,248,0.5));
        }

        .pulse-element {
            transform-origin: center;
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
    </style>

    <!-- Header / Title -->
    <text x="40" y="38" class="stage-badge">BORDER LIO GATEWAY • PERIMETER ADMISSION</text>
    <text x="40" y="58" class="title" style="font-size: 16px;">GatewayInterceptor Pipeline</text>
    <text x="40" y="76" class="subtitle">Admission hook evaluated prior to JSON-RPC request dispatch</text>

    <!-- Pipeline Connecting Track -->
    <path d="M 50 160 L 850 160" fill="none" stroke="#27272a" stroke-width="4" stroke-linecap="round" />
    <path d="M 50 160 L 850 160" fill="none" class="anim-track" />

    <!-- STAGE 1: Incoming Request -->
    <g transform="translate(40, 110)">
        <rect width="140" height="100" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
        <path d="M 8 1.5 L 132 1.5" stroke="#71717a" stroke-width="2.5" stroke-linecap="round" />
        <text x="16" y="26" class="stage-badge">STAGE 1</text>
        <text x="16" y="46" class="title">Transport L4/L7</text>
        <text x="16" y="64" class="subtitle">POST /mcp</text>
        <text x="16" y="78" class="code-pill">HTTP/1.1 &amp; HTTP/2</text>
    </g>

    <!-- STAGE 2: JWT Bearer -->
    <g transform="translate(205, 110)">
        <rect width="140" height="100" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
        <path d="M 8 1.5 L 132 1.5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
        <text x="16" y="26" class="badge-amber">STAGE 2</text>
        <text x="16" y="46" class="title">OAuth 2.1 JWT</text>
        <text x="16" y="64" class="subtitle">NIST SP 800-207</text>
        <text x="16" y="80" class="badge-red">DENY: 401</text>
    </g>

    <!-- STAGE 3: Rate Limiter -->
    <g transform="translate(370, 110)">
        <rect width="140" height="100" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
        <path d="M 8 1.5 L 132 1.5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
        <text x="16" y="26" class="badge-amber">STAGE 3</text>
        <text x="16" y="46" class="title">Rate Limiter</text>
        <text x="16" y="64" class="subtitle">OWASP API4:2023</text>
        <text x="16" y="80" class="badge-red">DENY: 429</text>
    </g>

    <!-- STAGE 4: GatewayInterceptor Hook -->
    <g transform="translate(535, 95)">
        <!-- Outer Glow -->
        <circle cx="85" cy="65" r="75" fill="url(#glowEmerald)" />
        <rect width="170" height="130" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
        <path d="M 10 1.5 L 160 1.5" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
        
        <text x="16" y="24" class="badge-green">STAGE 4</text>
        <text x="16" y="44" class="title" style="fill: #34d399; font-size: 14px;">GatewayInterceptor</text>
        <text x="16" y="60" class="subtitle">Perimeter Admission Hook</text>
        
        <!-- Engines Supported Pills -->
        <g transform="translate(16, 70)">
            <rect width="138" height="20" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1" />
            <text x="8" y="14" style="font-family: 'Inter', sans-serif; font-size: 9px; fill: #6ee7b7; font-weight: 600;">Jev • ONNX • Rules • Custom</text>
        </g>
        
        <text x="16" y="112" class="badge-red">DENY: 403 (-32099)</text>
    </g>

    <!-- STAGE 5: Dispatch & Enclave -->
    <g transform="translate(730, 110)">
        <rect width="130" height="100" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
        <path d="M 8 1.5 L 122 1.5" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
        <text x="16" y="26" class="stage-badge">STAGE 5</text>
        <text x="16" y="46" class="title">Router &amp; Mesh</text>
        <text x="16" y="64" class="subtitle">Dual-Era MCP</text>
        <text x="16" y="80" style="font-family: 'Inter', sans-serif; font-size: 9px; fill: #10b981; font-weight: 600;">Enclave Execution</text>
    </g>

    <!-- Footer Legend: Humanized Architecture Principles -->
    <g transform="translate(40, 262)">
        <rect width="820" height="64" rx="10" fill="#131316" stroke="#27272a" stroke-width="1" />
        
        <!-- Column 1: Agnostic Design -->
        <g transform="translate(20, 0)">
            <circle cx="6" cy="23" r="4.5" fill="#10b981" />
            <text x="18" y="27" class="title" style="font-size: 11px; font-weight: 700; fill: #f4f4f5;">Agnostic Design</text>
            <text x="18" y="44" class="subtitle" style="font-size: 10px; fill: #a1a1aa;">Zero external dependencies in core SDK</text>
        </g>
        
        <!-- Separator 1 -->
        <line x1="285" y1="14" x2="285" y2="50" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />

        <!-- Column 2: Fail-Closed Default -->
        <g transform="translate(300, 0)">
            <circle cx="6" cy="23" r="4.5" fill="#f59e0b" />
            <text x="18" y="27" class="title" style="font-size: 11px; font-weight: 700; fill: #f4f4f5;">Fail-Closed Default</text>
            <text x="18" y="44" class="subtitle" style="font-size: 10px; fill: #a1a1aa;">Rejects with HTTP 403 / -32099 on error</text>
        </g>
        
        <!-- Separator 2 -->
        <line x1="565" y1="14" x2="565" y2="50" stroke="#27272a" stroke-width="1" stroke-dasharray="2 2" />

        <!-- Column 3: Context Isolation -->
        <g transform="translate(580, 0)">
            <circle cx="6" cy="23" r="4.5" fill="#38bdf8" />
            <text x="18" y="27" class="title" style="font-size: 11px; font-weight: 700; fill: #f4f4f5;">Context Isolation</text>
            <text x="18" y="44" class="subtitle" style="font-size: 10px; fill: #a1a1aa;">Deep clone and frozen execution context</text>
        </g>
    </g>
</svg>
