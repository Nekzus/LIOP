<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Uniform Pure Black Canvas (Vercel Style) -->
  <rect width="1080" height="1080" fill="#000000" />

  <defs>
    <!-- Technical Background Grid (Unified across all 4 slides) -->
    <pattern id="technical-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#121212" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="url(#technical-grid)" opacity="0.75" />

  <!-- ==================== TOP SYSTEM BAR (SHARED FIXED ELEMENT) ==================== -->
  <g transform="translate(60, 50)">
    <!-- Compact Open Source Pill -->
    <rect width="128" height="32" rx="16" fill="#0C0C0C" stroke="#222222" stroke-width="1.2" />
    
    <!-- Lucide: CodeXml (14x14) in Emerald -->
    <g transform="translate(14, 9)">
      <g stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="10 10 13 7 10 4" />
        <polyline points="4 4 1 7 4 10" />
        <line x1="8.5" x2="5.5" y1="1.5" y2="12.5" />
      </g>
    </g>
    
    <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#EDEDED" letter-spacing="0.4">
      Open Source
    </text>

    <!-- Status Pill: Fase de Pruebas (Minimalist Badge) -->
    <g transform="translate(140, 0)">
      <rect width="118" height="32" rx="16" fill="#0C0C0C" stroke="#222222" stroke-width="1.2" />
      <text x="59" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" letter-spacing="0.3">
        Fase de Pruebas
      </text>
    </g>

    <!-- Slide Indicator -->
    <text x="960" y="21" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#71717A" letter-spacing="0.5">
      Slide 02 / 04
    </text>
  </g>

  <!-- ==================== SECTION TITLE & SUBTITLE (SHARED FIXED ELEMENT) ==================== -->
  <g transform="translate(60, 115)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      El Problema: Context-Pulling
    </text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400" fill="#71717A">
      Extraer registros crudos para que un cliente externo los filtre quiebra la custodia y satura la red WAN.
    </text>
  </g>

  <!-- ==================== ARCHITECTURE CARD: CONTEXT-PULLING (Y=205 to Y=625, H=420) ==================== -->
  <g transform="translate(60, 205)">
    <rect width="960" height="420" rx="14" fill="#080808" stroke="#222222" stroke-width="1.2" />

    <!-- Node Left: Base de Datos / Host / OT (x=36, y=36, w=224, h=240) -->
    <g transform="translate(36, 36)">
      <rect width="224" height="240" rx="10" fill="#0D0D0D" stroke="#222222" stroke-width="1.2" />
      <rect x="16" y="14" width="112" height="20" rx="4" fill="#161616" />
      <text x="72" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#71717A">HOST / NODO OT</text>
      
      <!-- Lucide: Database (32x32) -->
      <g transform="translate(96, 52)">
        <g stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <ellipse cx="16" cy="7" rx="12" ry="4"/>
          <path d="M4 7v18a12 4 0 0 0 24 0V7"/>
          <path d="M4 16a12 4 0 0 0 24 0"/>
        </g>
      </g>
      <text x="112" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#EDEDED">Base de Datos / OT</text>
      <text x="112" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" fill="#71717A">Host local o planta industrial</text>

      <!-- Internal Detail Box -->
      <rect x="14" y="154" width="196" height="68" rx="6" fill="#131313" stroke="#1F1F1F" stroke-width="0.8" />
      <text x="112" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" fill="#71717A">SQL, logs o telemetría</text>
      <text x="112" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#F87171">Datos confidenciales (PII / OT)</text>
    </g>

    <!-- Central WAN Network Pipe (from x=260 to 700, Y=156) -->
    <line x1="260" y1="156" x2="316" y2="156" stroke="#4A2626" stroke-width="1.8" stroke-dasharray="5 5" />
    
    <!-- Central Warning Badge -->
    <g transform="translate(316, 134)">
      <rect width="328" height="44" rx="22" fill="#1A0D0D" stroke="#4A1D1D" stroke-width="1.2" />
      <!-- Lucide: AlertCircle (18x18) -->
      <g transform="translate(18, 13)">
        <g stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cx="9" cy="9" r="7.5"/>
          <line x1="9" y1="5.5" x2="9" y2="9.5"/>
          <line x1="9" y1="12.5" x2="9.01" y2="12.5"/>
        </g>
      </g>
      <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F87171">
        Datos expuestos en red WAN
      </text>
    </g>

    <line x1="644" y1="156" x2="694" y2="156" stroke="#4A2626" stroke-width="1.8" stroke-dasharray="5 5" />
    <path d="M690 148 L698 156 L690 164" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <text x="480" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#71717A">
      Extracción masiva de registros crudos a través de la red WAN
    </text>

    <!-- Node Right: Cliente Orquestador (x=700, y=36, w=224, h=240) -->
    <g transform="translate(700, 36)">
      <rect width="224" height="240" rx="10" fill="#0D0D0D" stroke="#222222" stroke-width="1.2" />
      <rect x="16" y="14" width="108" height="20" rx="4" fill="#161616" />
      <text x="70" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#71717A">NUBE / WAN</text>

      <!-- Lucide: Bot (32x32) -->
      <g transform="translate(96, 52)">
        <g stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M16 10V5H10"/><rect width="20" height="16" x="6" y="10" rx="2"/>
          <path d="M3 18h3"/><path d="M26 18h3"/><path d="M19 17v2"/><path d="M13 17v2"/>
        </g>
      </g>
      <text x="112" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#EDEDED">Orquestador</text>
      <text x="112" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#71717A">Agente, LLM o analítica</text>

      <!-- Internal Detail Box -->
      <rect x="14" y="154" width="196" height="68" rx="6" fill="#131313" stroke="#1F1F1F" stroke-width="0.8" />
      <text x="112" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" fill="#71717A">Filtrado en cliente externo</text>
      <text x="112" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#F87171">Saturación de tokens y WAN</text>
    </g>

    <!-- Bottom Summary Box inside Card -->
    <g transform="translate(36, 306)">
      <rect width="888" height="84" rx="8" fill="#0D0D0D" stroke="#222222" stroke-width="1" />
      <g transform="translate(20, 31)">
        <g stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <circle cx="11" cy="11" r="9"/>
          <line x1="11" y1="7" x2="11" y2="11"/>
          <line x1="11" y1="15" x2="11.01" y2="15"/>
        </g>
      </g>
      <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
        Ruptura del perímetro de seguridad y custodia:
      </text>
      <text x="56" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#D4D4D8">
        La arquitectura habitual traslada registros confidenciales o telemetría a través de la red WAN
      </text>
      <text x="56" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        para que un cliente externo filtre información que debió procesarse dentro del host de origen.
      </text>
    </g>
  </g>

  <!-- ==================== 3 CONSEQUENCE TILES (SHARED ROW: Y=655, H=250) ==================== -->
  <g transform="translate(60, 655)">
    <!-- Tile 1: Pérdida de Custodia (w=304, h=250) -->
    <g transform="translate(0, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#F87171">SEGURIDAD PERIMETRAL</text>

      <g transform="translate(20, 56)">
        <g stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Pérdida de Custodia
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#F87171">
        Perímetro Vulnerado
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Los datos salen del servidor u OT.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • La organización cede el control.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Expansión de superficie de ataque.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Riesgo de exfiltración de PII.
      </text>
    </g>

    <!-- Tile 2: Quiebre Normativo (w=304, h=250, x=328) -->
    <g transform="translate(328, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#F87171">COMPLIANCE &amp; LEGAL</text>

      <g transform="translate(20, 56)">
        <g stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9.5" y1="12.5" x2="14.5" y2="17.5"/>
          <line x1="14.5" y1="12.5" x2="9.5" y2="17.5"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Riesgo Normativo
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#F87171">
        Incumplimiento Legal
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Infracción de GDPR y HIPAA.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Bloqueo en banca, salud y OT.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • No conformidad con SOC 2.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Trazabilidad rota en auditoría.
      </text>
    </g>

    <!-- Tile 3: Sobrecarga e Ineficiencia (w=304, h=250, x=656) -->
    <g transform="translate(656, 0)">
      <rect width="304" height="250" rx="10" fill="#080808" stroke="#1F1F1F" stroke-width="1.2" />
      <rect x="20" y="20" width="140" height="22" rx="4" fill="#141414" />
      <text x="90" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#F87171">EFICIENCIA &amp; COSTOS</text>

      <g transform="translate(20, 56)">
        <g stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
          <polyline points="17 18 23 18 23 12"/>
        </g>
      </g>
      <text x="52" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
        Sobrecarga de Red
      </text>

      <text x="20" y="104" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="500" fill="#F87171">
        Ineficiencia de WAN
      </text>

      <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Inviable en IoT / edge industrial.
      </text>
      <text x="20" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Saturación de ancho de banda.
      </text>
      <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Latencia crítica en respuestas.
      </text>
      <text x="20" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#A1A1AA">
        • Costos elevados de transferencia.
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER / SHARED FIXED ACTION BAR ==================== -->
  <g transform="translate(60, 960)">
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#71717A">
      Context-Pulling: La fragilidad del modelo actual en empresas y redes industriales
    </text>

    <!-- Swipe Prompt Pill (w=280, h=42, rx=21) -->
    <g transform="translate(680, 5)">
      <rect width="280" height="42" rx="21" fill="#121212" stroke="#2B2B2B" stroke-width="1.2" />
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">
        Desliza hacia la solución
      </text>
      <!-- Lucide: ArrowRight -->
      <g transform="translate(244, 13)">
        <g stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <line x1="2" y1="8" x2="14" y2="8"/>
          <polyline points="9 3 14 8 9 13"/>
        </g>
      </g>
    </g>
  </g>
</svg>
