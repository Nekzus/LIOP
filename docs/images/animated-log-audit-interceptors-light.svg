<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconRing {
        0% { r: 4; opacity: 0.9; }
        100% { r: 16; opacity: 0; }
      }
      .anim-pulse { animation: pulse 3s ease-in-out infinite; }
      .anim-dash { stroke-dasharray: 6 6; animation: flowDash 1.5s linear infinite; }
      .beacon { animation: beaconRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    </style>

    <linearGradient id="bgGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="cardGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="14" fill="url(#bgGradLight)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">
      LIOP Interceptor Architecture
    </text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">
      Agnostic hooks across perimeter admission, operational logs, and cryptographic audit chains
    </text>
  </g>

  <!-- Upper Container: LIOP Core & SDK Boundary -->
  <g transform="translate(40, 75)">
    <rect width="820" height="155" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.05em">
      LIOP PROTOCOL &amp; SDK CORE
    </text>

    <!-- Node 1: Gateway -->
    <g transform="translate(20, 42)">
      <rect width="245" height="96" rx="8" fill="url(#cardGradLight)" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="20" cy="24" r="6" fill="#0284c7" />
      <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">LiopHybridGateway</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">L4/L7 Ingress (HTTP/1.1 &amp; HTTP/2)</text>
      <rect x="20" y="65" width="205" height="22" rx="4" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="0.8" />
      <text x="28" y="80" font-family="monospace" font-size="10.5" font-weight="600" fill="#0284c7">GatewayInterceptor</text>
    </g>

    <!-- Node 2: Logger -->
    <g transform="translate(287, 42)">
      <rect width="245" height="96" rx="8" fill="url(#cardGradLight)" stroke="#d97706" stroke-width="1.2" />
      <circle cx="20" cy="24" r="6" fill="#d97706" />
      <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">LiopLogger</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">Operational Stream (stderr)</text>
      <rect x="20" y="65" width="205" height="22" rx="4" fill="#d97706" fill-opacity="0.1" stroke="#d97706" stroke-width="0.8" />
      <text x="28" y="80" font-family="monospace" font-size="10.5" font-weight="600" fill="#d97706">LogInterceptor</text>
    </g>

    <!-- Node 3: AuditLogger -->
    <g transform="translate(555, 42)">
      <rect width="245" height="96" rx="8" fill="url(#cardGradLight)" stroke="#059669" stroke-width="1.2" />
      <circle cx="20" cy="24" r="6" fill="#059669" />
      <text x="34" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">AuditLogger</text>
      <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#64748b">SOC 2 Hash-Chain Ledger</text>
      <rect x="20" y="65" width="205" height="22" rx="4" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="0.8" />
      <text x="28" y="80" font-family="monospace" font-size="10.5" font-weight="600" fill="#059669">AuditInterceptor</text>
    </g>
  </g>

  <!-- Animated Connecting Flow Lines -->
  <g>
    <!-- Stream 1 (Gateway) -->
    <path d="M 182 230 L 182 280" stroke="#0284c7" stroke-width="1.5" class="anim-dash" />
    <!-- Stream 2 (Logger) -->
    <path d="M 450 230 L 450 280" stroke="#d97706" stroke-width="1.5" class="anim-dash" />
    <!-- Stream 3 (Audit) -->
    <path d="M 717 230 L 717 280" stroke="#059669" stroke-width="1.5" class="anim-dash" />
  </g>

  <!-- Lower Container: Developer Application Space -->
  <g transform="translate(40, 280)">
    <rect width="820" height="105" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.05em">
      DEVELOPER APPLICATION SPACE (ANY ENGINE OR RULESET)
    </text>

    <!-- Target 1: TypeSafe Jev -->
    <g transform="translate(20, 38)">
      <rect width="245" height="54" rx="6" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">TypeSafe Jev (Cloud AI)</text>
      <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">Semantic judgment &amp; threat detection</text>
    </g>

    <!-- Target 2: SIEM / Datadog / Splunk -->
    <g transform="translate(287, 38)">
      <rect width="245" height="54" rx="6" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">SIEM / Monitoring</text>
      <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">Datadog, Splunk, Loki, OpenTelemetry</text>
    </g>

    <!-- Target 3: Local Rules / ONNX -->
    <g transform="translate(555, 38)">
      <rect width="245" height="54" rx="6" fill="url(#cardGradLight)" stroke="#cbd5e1" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Custom Rules &amp; ONNX</text>
      <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#64748b">Regex policies, zero-latency models</text>
    </g>
  </g>

  <!-- Footer: Guarantees & Contract Invariants -->
  <g transform="translate(40, 400)">
    <rect width="820" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />

    <!-- Column 1 -->
    <g transform="translate(20, 16)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0284c7">Perimeter Admission</text>
      <text x="0" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Pre-dispatch filter with fail-closed default</text>
    </g>
    <line x1="285" y1="12" x2="285" y2="50" stroke="#e2e8f0" stroke-width="1" />

    <!-- Column 2 -->
    <g transform="translate(305, 16)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#d97706">Async Fire-and-Forget</text>
      <text x="0" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Out-of-band execution with recursion guard</text>
    </g>
    <line x1="555" y1="12" x2="555" y2="50" stroke="#e2e8f0" stroke-width="1" />

    <!-- Column 3 -->
    <g transform="translate(575, 16)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#059669">Post-Seal Integrity</text>
      <text x="0" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="400" fill="#64748b">Immutable clone preserves cryptographic chain</text>
    </g>
  </g>
</svg>
