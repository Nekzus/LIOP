name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - 'feat/*'
      - 'feature/*'
  pull_request:
    branches:
      - main
      - alpha
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Code Formatting
        run: pnpm run check

      - name: Validate CHANGELOG Integrity
        run: |
          if grep -qE "<<<<<<<|=======|>>>>>>>" CHANGELOG.md; then
            echo "Error: Git conflict markers found in CHANGELOG.md"
            exit 1
          fi

  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      studio: ${{ steps.filter.outputs.studio }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Paths Filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            sdk:
              - 'sdks/typescript/**'
              - 'protocol/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            studio:
              - 'tools/liop-studio/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  test:
    name: SDK Build & Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.sdk == 'true' || github.event_name == 'pull_request'
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x, 22.x]

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm --filter @nekzus/liop build

      - name: Run Tests
        run: pnpm run test

  test-studio:
    name: Studio Build & Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [lint, detect-changes]
    if: needs.detect-changes.outputs.studio == 'true' || github.event_name == 'pull_request'
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x, 22.x]

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core SDK
        run: pnpm --filter @nekzus/liop build

      - name: Run Build Studio All
        run: pnpm --filter @nekzus/liop-studio build:all

      - name: Run Studio Unit Tests
        run: pnpm --filter @nekzus/liop-studio test

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies (High+ Severity)
        run: pnpm audit --audit-level=high

  publish:
    name: Publish SDK to NPM
    needs: [lint, detect-changes, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (needs.detect-changes.outputs.sdk == 'true') && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/heads/feat/'))
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Fetch Git Notes
        run: git fetch origin '+refs/notes/*:refs/notes/*' || true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm --filter @nekzus/liop build

      - name: Semantic Release
        if: github.ref_name == 'alpha' || github.ref_name == 'beta' || github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release -e ./release.sdk.config.js

      - name: Publish Package to NPM (OIDC Trusted Publishing)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            pnpm --filter @nekzus/liop publish --no-git-checks --provenance
          else
            pnpm --filter @nekzus/liop publish --no-git-checks --provenance --tag ${{ github.ref_name }}
          fi

  publish-studio:
    name: Publish LIOP Studio to NPM
    needs: [lint, detect-changes, test-studio, security, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.security.result == 'success' &&
      (needs.test-studio.result == 'success' || needs.test-studio.result == 'skipped') &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (needs.detect-changes.outputs.studio == 'true') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/beta')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Fetch Git Notes and Pull Latest
        run: |
          git fetch origin '+refs/notes/*:refs/notes/*' || true
          git pull --rebase origin ${{ github.ref_name }} || true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core SDK
        run: pnpm --filter @nekzus/liop build

      - name: Run Build Studio All
        run: pnpm --filter @nekzus/liop-studio build:all

      - name: Semantic Release Studio
        if: github.ref_name == 'alpha' || github.ref_name == 'beta' || github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release -e ./tools/liop-studio/release.config.js

      - name: Publish Studio to NPM (OIDC Trusted Publishing)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            pnpm --filter @nekzus/liop-studio publish --no-git-checks --provenance
          else
            pnpm --filter @nekzus/liop-studio publish --no-git-checks --provenance --tag ${{ github.ref_name }}
          fi
